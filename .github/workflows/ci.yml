name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    name: 编译 + 单元测试 + 集成测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: verify
        run: mvn -B clean verify

  gate:
    name: GF 闸门
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: gate
        run: mvn -B verify -Pgate
