server:
  port: ${FOUNDATION_SERVER_PORT:8081}
  shutdown: graceful

spring:
  application:
    name: foundation
  datasource:
    # Foundation 独立库（可与 Tioka 共用实例、不同库，F-02 BAS-01）
    url: ${foundation.db.url}
    username: ${foundation.db.username}
    password: ${foundation.db.password}
    hikari:
      maximum-pool-size: ${FOUNDATION_DB_POOL_MAX:20}
  flyway:
    enabled: ${foundation.flyway.enabled}
    locations: classpath:db/migration
  data:
    redis:
      host: ${FOUNDATION_REDIS_HOST:localhost}
      port: ${FOUNDATION_REDIS_PORT:6379}
      database: ${FOUNDATION_REDIS_DATABASE:0}
  jackson:
    default-property-inclusion: non_null

foundation:
  # 部署命名空间（36 号规划 ADP-07 / P5）：同一镜像多套部署时隔离 realm、topic、键前缀、桶与库。
  # 缺省 default 时派生值与历史字面量完全一致；生产必须显式注入，启动会打 WARN。
  deployment-id: ${FOUNDATION_DEPLOYMENT_ID:default}
  server:
    # 装配 profile（36 号规划 ADP-05）：full 全量 / iam 组织账号权限 / common 字典参数编号审计 / minimal 最小形态
    # 逐域覆盖用 foundation.server.domains.<domain>=true|false；缺省由 profile 推导
    profile: ${FOUNDATION_SERVER_PROFILE:full}
  db:
    url: ${FOUNDATION_DB_URL:jdbc:postgresql://localhost:5432/foundation}
    username: ${FOUNDATION_DB_USERNAME:foundation}
    password: ${FOUNDATION_DB_PASSWORD:foundation}
  flyway:
    enabled: ${FOUNDATION_FLYWAY_ENABLED:true}
  app:
    # 应用默认授权模式（CONCENTRATED 集中 / DISTRIBUTED 分散，F-05 BAS-04 §配置）
    default-auth-mode: ${FOUNDATION_APP_DEFAULT_AUTH_MODE:CONCENTRATED}
    # 客户端密钥轮换周期（天），到期提示轮换（F-05 BAS-04 §配置）
    client-secret-rotation-days: ${FOUNDATION_APP_SECRET_ROTATION_DAYS:180}
    # 服务账号客户端 client_id 模板，{appCode} 为占位（F-05 BAS-04 §配置）
    service-account-client-id-pattern: "{appCode}-sa"
  keycloak:
    server-url: ${FOUNDATION_KEYCLOAK_URL:http://localhost:8180}
    realm: ${FOUNDATION_KEYCLOAK_REALM:${foundation.namespace.realm}}
    admin-realm: master
    client-id: foundation-admin
    client-secret: ${FOUNDATION_KEYCLOAK_SECRET:}
    connect-timeout: 3s
    read-timeout: 5s
  security:
    # 令牌来源（F-07 §2）：jwt = 作资源服务器校验 Keycloak 签发的令牌
    token-source: "${FOUNDATION_TOKEN_SOURCE:jwt}"
    # 验签公钥集与签发者：默认指向同一 Keycloak 的 realm 端点（F-07 §2、ADR-029 第 32 条）
    # realm 由 deployment-id 派生，JWKS 与 issuer 必须同源，否则令牌 iss 校验失败
    jwk-set-uri: "${FOUNDATION_SECURITY_JWK_SET_URI:${foundation.namespace.jwk-set-uri}}"
    issuer: "${FOUNDATION_SECURITY_ISSUER:${foundation.namespace.issuer}}"
  dict:
    cache-ttl: ${FOUNDATION_DICT_CACHE_TTL:5m}
  param:
    secret-mask: "******"
    max-value-length: 4096
    master-key: ${FOUNDATION_PARAM_MASTER_KEY:}
  event:
    topic: ${FOUNDATION_EVENT_TOPIC:${foundation.namespace.event-topic}}
  # 对象存储桶：实际绑定键是 foundation.file.storage.bucket（FileProperties），
  # 部署文档里的 foundation.storage.bucket-prefix 从未被代码读取，已统一到此键。
  file:
    storage:
      bucket: ${FOUNDATION_STORAGE_BUCKET:${foundation.namespace.bucket}}
  # 接入侧 starter-cache 消费（服务端自身按需引入）；显式环境变量优先
  cache:
    key-prefix: ${FOUNDATION_CACHE_KEY_PREFIX:${foundation.namespace.key-prefix}}

# 存活/就绪探针（BAS-21 §3.10）：/actuator/health/liveness、/actuator/health/readiness
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
