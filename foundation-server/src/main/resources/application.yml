server:
  port: ${FOUNDATION_SERVER_PORT:8081}
  shutdown: graceful

spring:
  application:
    name: foundation
  datasource:
    # Foundation 独立库（可与 Tioka 共用实例、不同库，F-02 BAS-01）
    url: ${foundation.db.url}
    username: ${foundation.db.username}
    password: ${foundation.db.password}
    hikari:
      maximum-pool-size: ${FOUNDATION_DB_POOL_MAX:20}
  flyway:
    enabled: ${foundation.flyway.enabled}
    locations: classpath:db/migration
  data:
    redis:
      host: ${FOUNDATION_REDIS_HOST:localhost}
      port: ${FOUNDATION_REDIS_PORT:6379}
      database: ${FOUNDATION_REDIS_DATABASE:0}
  jackson:
    default-property-inclusion: non_null

foundation:
  db:
    url: ${FOUNDATION_DB_URL:jdbc:postgresql://localhost:5432/foundation}
    username: ${FOUNDATION_DB_USERNAME:foundation}
    password: ${FOUNDATION_DB_PASSWORD:foundation}
  flyway:
    enabled: ${FOUNDATION_FLYWAY_ENABLED:true}
  keycloak:
    server-url: ${FOUNDATION_KEYCLOAK_URL:http://localhost:8180}
    realm: enterprise
    admin-realm: master
    client-id: foundation-admin
    client-secret: ${FOUNDATION_KEYCLOAK_SECRET:}
    connect-timeout: 3s
    read-timeout: 5s
