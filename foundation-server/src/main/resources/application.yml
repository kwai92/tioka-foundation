server:
  port: ${FOUNDATION_SERVER_PORT:8081}
  shutdown: graceful

spring:
  application:
    name: foundation
  datasource:
    # Foundation 独立库（可与 Tioka 共用实例、不同库，F-02 BAS-01）
    url: ${foundation.db.url}
    username: ${foundation.db.username}
    password: ${foundation.db.password}
    hikari:
      maximum-pool-size: ${FOUNDATION_DB_POOL_MAX:20}
  flyway:
    enabled: ${foundation.flyway.enabled}
    locations: classpath:db/migration
  data:
    redis:
      host: ${FOUNDATION_REDIS_HOST:localhost}
      port: ${FOUNDATION_REDIS_PORT:6379}
      database: ${FOUNDATION_REDIS_DATABASE:0}
  jackson:
    default-property-inclusion: non_null

foundation:
  db:
    url: ${FOUNDATION_DB_URL:jdbc:postgresql://localhost:5432/foundation}
    username: ${FOUNDATION_DB_USERNAME:foundation}
    password: ${FOUNDATION_DB_PASSWORD:foundation}
  flyway:
    enabled: ${FOUNDATION_FLYWAY_ENABLED:true}
  app:
    # 应用默认授权模式（CONCENTRATED 集中 / DISTRIBUTED 分散，F-05 BAS-04 §配置）
    default-auth-mode: ${FOUNDATION_APP_DEFAULT_AUTH_MODE:CONCENTRATED}
    # 客户端密钥轮换周期（天），到期提示轮换（F-05 BAS-04 §配置）
    client-secret-rotation-days: ${FOUNDATION_APP_SECRET_ROTATION_DAYS:180}
    # 服务账号客户端 client_id 模板，{appCode} 为占位（F-05 BAS-04 §配置）
    service-account-client-id-pattern: "{appCode}-sa"
  keycloak:
    server-url: ${FOUNDATION_KEYCLOAK_URL:http://localhost:8180}
    realm: enterprise
    admin-realm: master
    client-id: foundation-admin
    client-secret: ${FOUNDATION_KEYCLOAK_SECRET:}
    connect-timeout: 3s
    read-timeout: 5s
  dict:
    cache-ttl: ${FOUNDATION_DICT_CACHE_TTL:5m}
  param:
    secret-mask: "******"
    max-value-length: 4096
    master-key: ${FOUNDATION_PARAM_MASTER_KEY:}
  event:
    topic: ${FOUNDATION_EVENT_TOPIC:fdn-events}

# 存活/就绪探针（BAS-21 §3.10）：/actuator/health/liveness、/actuator/health/readiness
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
