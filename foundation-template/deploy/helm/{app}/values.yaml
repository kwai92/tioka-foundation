# {app} Helm values（BAS-25 模板片段：按环境覆盖）。
replicaCount: 2

image:
  repository: registry.example.com/{app}
  tag: "0.1.0"
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

# 应用环境变量（对应 application.yml 中的 ${...} 占位）
env:
  APP_SERVER_PORT: "8080"
  APP_DB_URL: jdbc:postgresql://postgres:5432/{app}
  APP_DB_USERNAME: {app}
  APP_DB_PASSWORD: ""
  FOUNDATION_BASE_URL: http://foundation:8080
  FOUNDATION_SERVICE_ACCOUNT: ""
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: "6379"
