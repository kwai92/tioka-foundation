server:
  port: ${APP_SERVER_PORT:8080}
  # 优雅停机：先摘流量再退出（S15 §16 部署与运维）
  shutdown: graceful

spring:
  application:
    name: {app}
  datasource:
    url: ${APP_DB_URL:jdbc:postgresql://localhost:5432/{app}}
    username: ${APP_DB_USERNAME:postgres}
    password: ${APP_DB_PASSWORD:postgres}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    # 统一 JSON 输出：null 字段不下发（00-施工总纲 §2.2）
    default-property-inclusion: non_null

# 接入总配置：foundation-starter-core 的 FoundationProperties，前缀就是 foundation。
# 旧模板写的 foundation.client.base-url / app-code / service-account 从未被任何
# @ConfigurationProperties 绑定（仓库内不存在 foundation.client 前缀），已按代码回写。
foundation:
  enabled: true
  # 接入总开关；关时各 starter 自动配置不激活（本地模式）
  # 中台地址（mode=foundation 时必填）
  base-url: ${FOUNDATION_BASE_URL:}
  # 应用编码（在 Foundation 登记的应用编码）
  app-code: {app}
  # 部署命名空间（ADP-07）：与 Foundation 服务端保持一致，否则读不到同一套缓存/事件
  deployment-id: ${FOUNDATION_DEPLOYMENT_ID:default}
  # 服务账号（只写不读，环境变量注入）
  service-account:
    client-id: ${FOUNDATION_SERVICE_ACCOUNT_CLIENT_ID:}
    client-secret: ${FOUNDATION_SERVICE_ACCOUNT_CLIENT_SECRET:}
    token-uri: ${FOUNDATION_SERVICE_ACCOUNT_TOKEN_URI:}
