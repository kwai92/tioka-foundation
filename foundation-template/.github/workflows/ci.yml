name: ci

on:
  push:
    branches: [ main ]
  pull_request:

# BAS-25 CI 模板：覆盖 S15 §5.3 的全部任务（编译、单元、集成/Testcontainers、
# ArchUnit、依赖漏洞扫描、OpenAPI 契约比对、权限清单校验、镜像构建）。
jobs:
  build:
    name: 模板 CI（S15 §5.3 全部任务）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 任务 1/2/3：编译 + 单元测试 + 集成测试（Testcontainers，*IT 由 failsafe 执行）
      - name: verify（编译 + 单元测试 + 集成/Testcontainers）
        run: mvn -B clean verify

      # 任务 4：ArchUnit（规则集来自 foundation-test：Controller 必须声明权限、跨模块只依赖 -api 等）
      - name: ArchUnit
        run: mvn -B test -Dtest=*Arch*

      # 任务 5：依赖漏洞扫描（OWASP dependency-check）
      - name: dependency-check
        run: mvn -B org.owasp:dependency-check-maven:check

      # 任务 6：OpenAPI 契约比对（springdoc 生成 openapi.json 后与基线 diff）
      # 契约基线文件位置：docs/openapi.json（首次接入时用 springdoc 导出并提交）
      - name: OpenAPI 契约比对（springdoc 生成 + diff）
        run: |
          mvn -B -DskipTests spring-boot:run -Dspring-boot.run.arguments="--springdoc.api-docs.path=/openapi.json" &
          npx --yes wait-on http://localhost:8080/openapi.json
          curl -sS http://localhost:8080/openapi.json -o openapi.json
          diff -u docs/openapi.json openapi.json

      # 任务 7：权限清单校验（导入形态与 Foundation 的 ManifestParser 一致）
      - name: 权限清单校验
        run: scripts/check-permission-manifest.sh docs/权限清单.json

      # 任务 8：镜像构建
      - name: docker build
        run: docker build -t {app}:${{ github.sha }} .
