# 敏感配置（口令与主密钥）。生产请用 existingSecret 指向外部 Secret（见 values-prod.yaml）
{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: foundation-secret
  labels:
    {{- include "foundation.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- toYaml .Values.secret | nindent 2 }}
  FOUNDATION_DB_OWNER_PASSWORD: {{ .Values.migration.dbPassword | quote }}
  FOUNDATION_KEYCLOAK_DB_PASSWORD: {{ .Values.secret.FOUNDATION_KEYCLOAK_SECRET | default "change-me-keycloak-db" | quote }}
  KEYCLOAK_ADMIN: "admin"
  KEYCLOAK_ADMIN_PASSWORD: "change-me-keycloak-admin"
{{- end }}
