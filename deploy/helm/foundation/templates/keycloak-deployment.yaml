# Keycloak Deployment（≥2 副本，会话用其内置分布式缓存）—— F-11 §3.1 / §3.7
apiVersion: apps/v1
kind: Deployment
metadata:
  name: foundation-keycloak
  labels:
    {{- include "foundation.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
spec:
  replicas: {{ .Values.keycloak.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "foundation.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "foundation.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: keycloak
    spec:
      containers:
        - name: keycloak
          image: "{{ .Values.keycloak.image.repository }}:{{ .Values.keycloak.image.tag }}"
          imagePullPolicy: {{ .Values.keycloak.image.pullPolicy }}
          args: ["start"]
          ports:
            - name: http
              containerPort: 8180
          env:
            - name: KC_HTTP_PORT
              value: "8180"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_PROXY
              value: edge
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: {{ .Values.config.FOUNDATION_KEYCLOAK_DB_URL | default "jdbc:postgresql://postgres:5432/keycloak" | quote }}
            - name: KC_DB_USERNAME
              value: {{ .Values.config.FOUNDATION_KEYCLOAK_DB_USERNAME | default "fdn_owner" | quote }}
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "foundation.secretName" . }}
                  key: FOUNDATION_KEYCLOAK_DB_PASSWORD
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: {{ include "foundation.secretName" . }}
                  key: KEYCLOAK_ADMIN
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "foundation.secretName" . }}
                  key: KEYCLOAK_ADMIN_PASSWORD
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.keycloakResources | nindent 12 }}
