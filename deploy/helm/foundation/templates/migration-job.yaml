# Flyway 迁移 Job（属主账号 fdn_owner）—— 应用的启动前置（Job 未完成前应用不就绪，F-11 §3.10）
apiVersion: batch/v1
kind: Job
metadata:
  name: foundation-migrate
  labels:
    {{- include "foundation.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "foundation.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      containers:
        - name: foundation-migrate
          image: "{{ .Values.migration.image.repository }}:{{ .Values.migration.image.tag }}"
          imagePullPolicy: {{ .Values.migration.image.pullPolicy }}
          args: ["migrate"]
          env:
            - name: FLYWAY_URL
              value: {{ .Values.migration.dbUrl | quote }}
            - name: FLYWAY_USER
              value: {{ .Values.migration.dbUser | quote }}
            - name: FLYWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "foundation.secretName" . }}
                  key: FOUNDATION_DB_OWNER_PASSWORD
            - name: FLYWAY_LOCATIONS
              value: {{ .Values.migration.locations | quote }}
            - name: FLYWAY_CONNECT_RETRIES
              value: {{ .Values.migration.connectRetries | quote }}
